name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Firebase / GCP Project ID'
        required: true
        default: 'disclosure-app'
        type: choice
        options:
        - disclosure-app
        - disclosure-app-dev
      region:
        description: 'GCP Region'
        required: true
        default: 'asia-northeast1'
      service_name:
        description: 'Cloud Run service name (e.g. checknewdisclosure2, listtopicsv2)'
        required: true
      target_revision:
        description: 'Target revision name to route 100% traffic to (e.g. checknewdisclosure2-00001-baw)'
        required: true

jobs:
  rollback:
    name: Route 100% Traffic to Target Revision
    runs-on: ubuntu-latest

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISCLOSURE_APP || secrets.FIREBASE_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Rollback traffic to target revision
      run: |
        echo "Updating traffic for service ${{ inputs.service_name }} to revision ${{ inputs.target_revision }}..."
        gcloud run services update-traffic ${{ inputs.service_name }} \
          --to-revisions=${{ inputs.target_revision }}=100 \
          --project=${{ inputs.project }} \
          --region=${{ inputs.region }}
        echo "Successfully updated traffic to ${{ inputs.target_revision }}."
