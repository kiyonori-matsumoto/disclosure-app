name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Firebase Project ID'
        required: true
        default: 'disclosure-app'
        type: choice
        options:
        - disclosure-app
        - disclosure-app-dev

jobs:
  deploy:
    name: Deploy to Firebase with Automated Rollback
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./functions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISCLOSURE_APP || secrets.FIREBASE_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Install dependencies
      run: npm ci

    - name: Lint and build
      run: npm run build

    - name: Run unit tests
      run: npm test

    - name: Pre-deploy - Record active Cloud Run revisions
      id: record_revisions
      run: npm run cd:record-revisions
      env:
        GCP_PROJECT_ID: ${{ inputs.project || 'disclosure-app' }}
        GCP_REGION: asia-northeast1
        REVISIONS_BACKUP_FILE: ./revisions-backup.json

    - name: Deploy to Firebase (Rules, Storage & Functions)
      run: npx firebase-tools deploy --only firestore:rules,storage,functions --project ${{ inputs.project || 'disclosure-app' }}

    - name: Post-deploy - Smoke test endpoints
      id: smoke_test
      run: npm run cd:smoke-test
      env:
        GCP_PROJECT_ID: ${{ inputs.project || 'disclosure-app' }}
        GCP_REGION: asia-northeast1

    - name: Automated Rollback on failure
      if: failure() && steps.record_revisions.outcome == 'success'
      run: npm run cd:rollback
      env:
        REVISIONS_BACKUP_FILE: ./revisions-backup.json
