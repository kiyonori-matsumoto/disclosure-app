name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Firebase Project ID'
        required: true
        default: 'disclosure-app'
        type: choice
        options:
        - disclosure-app
        - disclosure-app-dev

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./functions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISCLOSURE_APP || secrets.FIREBASE_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Install dependencies
      run: npm ci

    - name: Lint and build
      run: npm run build

    - name: Run unit tests
      run: npm test

    - name: Deploy to Firebase (Rules, Storage & Functions)
      run: npx firebase-tools deploy --only firestore:rules,storage,functions --project ${{ inputs.project || 'disclosure-app' }}
